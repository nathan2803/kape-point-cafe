<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" fill="none">
  <defs>
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C87D32" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FAF7F2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cupGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EADBCC"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E2013"/>
      <stop offset="100%" stop-color="#1B0C06"/>
    </linearGradient>
    <linearGradient id="cremaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D99B5B"/>
      <stop offset="100%" stop-color="#A5632A"/>
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="250" cy="220" r="180" fill="url(#heroGlow)"/>

  <!-- Shadow below saucer -->
  <ellipse cx="250" cy="340" rx="170" ry="24" fill="#000000" fill-opacity="0.12"/>

  <!-- Saucer -->
  <ellipse cx="250" cy="315" rx="160" ry="28" fill="#EADBCC"/>
  <ellipse cx="250" cy="313" rx="145" ry="22" fill="#FFFFFF"/>
  <ellipse cx="250" cy="310" rx="90" ry="12" fill="#D8C5B2" fill-opacity="0.5"/>

  <!-- Cup Handle -->
  <path d="M330 200 C380 200, 385 270, 325 270" stroke="url(#cupGrad)" stroke-width="20" stroke-linecap="round" fill="none"/>
  <path d="M330 200 C370 200, 375 265, 325 265" stroke="#D8C5B2" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Cup Body -->
  <path d="M165 170 C175 285, 205 310, 250 310 C295 310, 325 285, 335 170 Z" fill="url(#cupGrad)"/>
  <path d="M165 170 C165 185, 335 185, 335 170 C335 155, 165 155, 165 170 Z" fill="#FFFFFF"/>
  
  <!-- Coffee Surface & Latte Art Heart -->
  <ellipse cx="250" cy="170" rx="80" ry="18" fill="url(#coffeeGrad)"/>
  <ellipse cx="250" cy="170" rx="72" ry="15" fill="url(#cremaGrad)"/>
  <!-- Latte Art Rosetta / Heart -->
  <path d="M250 176 C240 168, 235 162, 244 158 C248 156, 250 160, 250 162 C250 160, 252 156, 256 158 C265 162, 260 168, 250 176 Z" fill="#FFFDF8"/>
  <circle cx="250" cy="162" r="3" fill="#FFFDF8"/>

  <!-- Steam lines -->
  <path d="M220 130 C210 100, 230 80, 220 50" stroke="#C87D32" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 1" opacity="0.6"/>
  <path d="M250 120 C265 95, 240 70, 255 40" stroke="#C87D32" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M280 135 C295 105, 275 80, 285 55" stroke="#C87D32" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 1" opacity="0.5"/>

  <!-- Coffee Beans on table -->
  <g transform="translate(100, 315) rotate(-15)">
    <ellipse cx="12" cy="8" rx="12" ry="8" fill="#3E2013"/>
    <path d="M4 8 C8 4, 16 12, 20 8" stroke="#FAF7F2" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(125, 325) rotate(25)">
    <ellipse cx="10" cy="7" rx="10" ry="7" fill="#2C1810"/>
    <path d="M3 7 C7 4, 13 10, 17 7" stroke="#FAF7F2" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <g transform="translate(370, 320) rotate(-35)">
    <ellipse cx="11" cy="7" rx="11" ry="7" fill="#3E2013"/>
    <path d="M3 7 C7 4, 15 10, 19 7" stroke="#FAF7F2" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>
